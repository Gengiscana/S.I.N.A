<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINA</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("sina_tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="img/logo.png" alt="">
      <div><b>S.I.N.A</b><span>Aprendizagem Ativa · SESI</span></div>
    </div>

    <div class="who" id="who"></div>

    <label class="sr">
      <span id="ic-busca"></span>
      <input id="q" placeholder="Buscar..." aria-label="Buscar" autocomplete="off">
    </label>

    <nav id="nav" aria-label="Seções"></nav>

    <button class="ni sair" id="sair" onclick="sair()"></button>
  </aside>

  <main>
    <header class="top">
      <div class="ttl" id="ttl"></div>
      <div class="chip" id="date"></div>
      <div class="chip"><span class="dot" id="dot"></span><span id="st">Conectando</span></div>
      <button class="btn sm" id="novo" onclick="pop(event)" aria-haspopup="true"></button>
      <button class="ib" id="tema" type="button"></button>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="pop" id="pop" hidden></div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div id="toast" role="status"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
